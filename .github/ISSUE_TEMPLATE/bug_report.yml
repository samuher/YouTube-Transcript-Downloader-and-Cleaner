name: Informe de error
description: Reportar un fallo reproducible sin compartir información privada
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: ¿Qué ocurre?
      description: Describe el problema y lo que esperabas.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Instalar... 2. Abrir... 3. ..."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Windows
        - Linux
        - macOS
        - Otra
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Python y Transcript Studio
      placeholder: "Python 3.12, Transcript Studio 0.2.0"
  - type: textarea
    id: logs
    attributes:
      label: Mensajes de error (sin secretos)
      description: No incluyas cookies, tokens, rutas privadas ni transcripciones personales.
