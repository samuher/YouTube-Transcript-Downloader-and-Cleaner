name: Windows installer (unsigned preview)

on:
  pull_request:
    paths:
      - 'packaging/windows/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies and packager
        shell: pwsh
        run: |
          python -m pip install -e '.[dev]' 'pyinstaller>=6.13,<7'
          python -m pytest -q
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows EXE and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Verify install, launch, restart and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist/installer/*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing installer' }
          ./packaging/windows/smoke.ps1 -Installer $installer.FullName
      - name: Record SHA-256
        shell: pwsh
        run: |
          Get-ChildItem 'dist/installer/*.exe' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Out-File 'dist/installer/SHA256SUMS.txt' -Encoding ascii
      - name: Upload unsigned preview for review only
        uses: actions/upload-artifact@v6
        with:
          name: transcript-studio-windows-preview-unsigned
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
